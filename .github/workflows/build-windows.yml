# בניית קובץ התקנה ל-Windows ופרסומו ב-Release קבוע בשם app-latest.
# רץ על כל דחיפה — כך קישור ההורדה תמיד מצביע על הגרסה העדכנית.
name: build-windows-installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/trivia-game-management-system-j1rxv0

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Build NSIS installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish installer to fixed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 'פונקט פארקערט — התקנה ל-Windows (עדכני)'
          body: |
            קובץ ההתקנה העדכני של פונקט פארקערט.
            מתעדכן אוטומטית בכל שינוי קוד — פשוט להוריד ולהתקין מחדש.
          files: release/*.exe
